<script>
document.addEventListener("DOMContentLoaded", function () {
  const form = document.getElementById("feedback-form");
  const statusEl = document.getElementById("status");
  const submitButton = form.querySelector('[type="submit"]');

  function isValidEmail(value) {
    return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(value);
  }

  function setStatus(message, modifier) {
    statusEl.className = modifier
      ? "feedback-status feedback-status--" + modifier
      : "feedback-status";
    statusEl.textContent = message;
  }

  function resetTurnstile() {
    if (window.turnstile && typeof window.turnstile.reset === "function") {
      window.turnstile.reset();
    }
  }

  form.addEventListener("submit", async function (event) {
    event.preventDefault();

    const category = form.querySelector("#feedback_category").value;
    const description = form.querySelector("#feedback_description").value.trim();
    const email = form.querySelector("#feedback_email").value.trim();
    const turnstileToken = form.querySelector('[name="cf-turnstile-response"]')?.value.trim();

    if (!category || !description || !email) {
      setStatus("Please complete all required fields.", "error");
      return;
    }

    if (!isValidEmail(email)) {
      setStatus("Please enter a valid email address.", "error");
      return;
    }

    if (!turnstileToken) {
      setStatus("Please complete the verification.", "error");
      return;
    }

    form.querySelector('[name="entry.270859303"]').value = window.location.href;
    form.querySelector('[name="entry.2136692707"]').value = navigator.userAgent;

    setStatus("Submitting feedback...");
    submitButton.disabled = true;

    try {
      const response = await fetch(form.action, {
        method: "POST",
        body: new FormData(form),
      });

      const result = await response.json().catch(() => ({}));

      if (!response.ok || !result.ok) {
        throw new Error(result.error || "Submission failed");
      }

      form.reset();
      resetTurnstile();
      setStatus("Thank you for your feedback.", "success");
    } catch (error) {
      resetTurnstile();
      setStatus("Sorry, your feedback could not be submitted. Please try again.", "error");
    } finally {
      submitButton.disabled = false;
    }
  });
});
</script>
