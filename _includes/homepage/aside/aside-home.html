<aside>
  <form class="quick-browse">
    <h2 class="blue-bar" style="width:300.2px;">quick browse</h2>

    <div class="form-body">

      <div class="form-group">
        <select id="composers" aria-label="Composer" name="c">
          <option value="">All Composers</option>
        </select>
      </div>

      <div class="form-group">
        <select id="genres" aria-label="Genre" name="g">
          <option value="">All Genres</option>
        </select>
      </div>

      <div class="form-group">
        <select id="voices" aria-label="Number of voices" name="v">
          <option value="">All Voices</option>
        </select>
      </div>

      <div class="form-group">
        <input id="titlebox"
               name="t"
               type="text"
               class="form-control"
               placeholder="Enter Title" aria-label="Title">
      </div>

      <div class="form-group text-center">
        <button
          type="button"
          class="btn btn-brown"
          style="width:110px;"
          onclick="storeBrowseParameters();">
          Browse
        </button>
      </div>

    </div>
  </form>
</aside>
