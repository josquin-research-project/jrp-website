  <form
    id="error-form"
    class="feedback-form"
    action="https://jrp-contact-turnstile.benjaminory.workers.dev/"
    method="POST"
  >
    <!-- Backend category -->
    <input type="hidden" name="entry.594716763" value="Data problem">

    <div class="form-group">
      <span class="error-report-target-label">Work or page being reported</span>
      <p id="error_target_display"></p>
      <input id="error_target" type="hidden">
    </div>

    <div class="form-group">
      <label for="error_description">Description *</label>
      <textarea
        id="error_description"
        name="entry.1835674852"
        rows="5"
        autofocus
        required
        placeholder="Describe the problem..."
      ></textarea>
    </div>

    <div class="form-group">
      <label for="error_email">Email address *</label>
      <input
        id="error_email"
        name="entry.590265142"
        type="email"
        required
        autocomplete="email"
        placeholder="you@example.com"
      >
    </div>

    <div class="form-group form-group--turnstile">
      <div
        id="error-verification"
        data-sitekey="0x4AAAAAAD1Dq7eklfy2d51u"
      ></div>
    </div>

    <!-- Hidden metadata -->
    <input type="hidden" name="entry.270859303" value="">
    <input type="hidden" name="entry.2136692707" value="">
    <input type="hidden" name="fvv" value="1">
    <input type="hidden" name="pageHistory" value="0">

    <div class="error-report-actions">
      <button type="button" class="button" id="error-report-cancel">Cancel</button>
      <button type="submit" class="button">Submit report</button>
    </div>

    <div id="error-report-status" class="feedback-status" aria-live="polite"></div>
  </form>
