<script>
function storeRepertory() {
  var repertory = document.getElementById("repertory");
  if (repertory) {
    localStorage.ANALYSISrepertory = repertory.value;
  }
}

document.addEventListener("DOMContentLoaded", function() {
  ensureAnalysisState();
  buildRepertorySelect();

  if (localStorage.ANALYSISrepertory) {
    document.getElementById("repertory").value = localStorage.ANALYSISrepertory;
  } else {
    document.getElementById("repertory").value = "Jos";
  }

  StylizeFormElements();
});
</script>
