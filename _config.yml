# title: The title of the website.
title: "Josquin Research Project"

# main_subtitle: The subtitle on the homepage.
main_subtitle: "Search, browse, and analyze complete scores of polyphonic music, ca. 1420– ca. 1520"

local: false

# Local asset builds live directly in ../digital-library-build.
# Never copy build outputs, scratch files, or build tools into the public site.
exclude:
  - output
  - tmp
  - .legacy-archive
  - tools

markdown: kramdown

kramdown:
  input: GFM
  auto_ids: true
  hard_wrap: false
  syntax_highlighter: rouge

highlighter: rouge

# Google Analytics tracking number:
google_analytics: "G-CWR44TKGGD"

