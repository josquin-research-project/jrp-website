<script>

document.addEventListener("DOMContentLoaded", function() {
  sessionStorage.removeItem("SEARCHLIST");
  buildComposerSelect();
  buildGenreSelect();
  buildVoiceSelect();
  const query = new URLSearchParams(window.location.search);
  for (const name of ['pitch', 'interval', 'rhythm', 'composers', 'genres', 'voices']) {
    const key = {composers:'composer', genres:'genre', voices:'voice'}[name] || name;
    if (query.has(key)) document.getElementById(name).value = query.get(key);
  }
  StylizeFormElements();
  setupSearchOnEnter();
  setupTooltips();
});




</script>
