<section class="search-filter">
	<section id="search" aria-labelledby="work-search-toggle" hidden>
		<div id="work-search-panel">
			<form action="#" onsubmit="return false;">
				<div class="form-group radio-wrap">
					<label><input type="radio" value="work" checked name="searchscope">This Work</label>
					<label style="margin-left:-20px;"><input type="radio" value="repertory" name="searchscope">Choose Repertory</label>
				</div>
				<div class="form-group">
					<input id="pitch" type="text" class="form-control" placeholder="Enter Pitch" aria-label="Pitch">
				</div>
				<div class="form-group">
					<input id="interval" type="text" class="form-control" placeholder="Enter Interval" aria-label="Interval">
				</div>
				<div class="form-group">
					<input id="rhythm" type="text" class="form-control" placeholder="Enter Rhythm" aria-label="Rhythm">
				</div>
				<div id="composers-select" class="form-group"></div>
				<div id="genres-select" class="form-group"></div>
				<div style="margin-top:28px;" class="form-group text-center border-dotted">
					<button type="button" style="margin-top:16px; cursor:pointer;" onclick="doSearch();" class="btn btn-brown">Search</button>
				</div>
			</form>
		</div>
	</section>

	<section id="tools" aria-labelledby="work-analysis-toggle" hidden>
		<div id="work-analysis-panel">
			<div class="form-group radio-wrap">
				<label><input id="this-work-analysis-button" type="radio" value="work" checked name="analysis-scope">This Work</label>
				<label style="margin-left:-20px;"><input id="all-works-analysis-button" type="radio" value="repertory" name="analysis-scope">Choose Repertory</label>
			</div>
			<div style="margin-left:5px;" id="repertory-select" class="analysis-hide form-group" hidden></div>
			<div style="margin-top:-14px;" class="form-group border-dotted">
				<ul id="analysis-list"></ul>
			</div>
		</div>
	</section>
</section>
