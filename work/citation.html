<template id="citation-button-template">
<button type="button" id="citation-open" class="citation-open" aria-haspopup="dialog" aria-controls="citation-dialog">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M7 4h12a3 3 0 0 1 3 3v2h-5V7a3 3 0 0 1 3-3M7 4a3 3 0 0 0-3 3v10H2v2a3 3 0 0 0 3 3h12a3 3 0 0 0 3-3v-2h-4M20 9v8M4 17h12v2a3 3 0 0 1-3 3M8 9h5M8 13h5" /></svg>
        <span><strong>Cite</strong> this work</span>
    </button>
</template>

<dialog id="citation-dialog" class="citation-dialog" aria-labelledby="citation-heading">
    <div class="citation-header">
        <h2 id="citation-heading">Suggested citation</h2>
        <button type="button" id="citation-close" class="citation-close" aria-label="Close citation">&times;</button>
    </div>
    <div class="citation-format-control">
        <select id="citation-format" class="button" aria-label="Citation format">
            <option value="note" selected>Chicago note format</option>
            <option value="bibliography">Chicago bibliography format</option>
        </select>
    </div>
    <p id="citation-text" class="citation-text"></p>
    <div class="citation-actions">
    <button type="button" id="citation-copy" class="button">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="8" y="8" width="12" height="13" rx="2"/><path d="M16 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h3"/></svg>
        Copy citation
    </button>
    <p id="citation-status" class="citation-status" role="status"></p>
    </div>
</dialog>

<script>
(() => {
    let activeWorkId = "";
    const dialog = document.getElementById("citation-dialog");
    const citation = document.getElementById("citation-text");
    const status = document.getElementById("citation-status");
    const format = document.getElementById("citation-format");

    function renderCitation() {
        const id = activeWorkId;
        const work = GetScoreCreditMetadata(id);
        if (!work) return;
        const title = document.createElement("i");
        title.textContent = [work.Title, work.WORK_ID === id ? work.Subtitle : ""].filter(Boolean).join(": ");
        const editor = FormatCreditNames(work["Edition source"]) || "the Josquin Research Project";
        const isNote = format.value === "note";
        const composer = String(work.Composer || "Anonymous").trim();
        const naturalName = composer.replace(/[{}]/g, "");
        const surname = composer.match(/^(.*)\{([^}]+)\}(.*)$/);
        const composerName = isNote ? naturalName : surname
            ? [surname[2] + surname[3], surname[1].replace(/[{}]/g, "").trim()].filter(Boolean).join(", ")
            : naturalName;
        const separator = isNote ? ", " : ". ";
        const publisher = editor === "the Josquin Research Project" ? "" : `${separator}Josquin Research Project`;
        const accessed = new Intl.DateTimeFormat("en-US", {
            year: "numeric", month: "long", day: "numeric"
        }).format(new Date());
        const url = document.createElement("a");
        url.href = `https://www.josqu.in/work/?id=${encodeURIComponent(id)}`;
        url.textContent = url.href;
        citation.replaceChildren(
            document.createTextNode(`${composerName}${separator}`),
            title,
            document.createTextNode(`${separator}${isNote ? "ed." : "Edited by"} ${editor}${publisher}${separator}${id}${separator}${isNote ? "accessed" : "Accessed"} ${accessed}${separator}`),
            url,
            document.createTextNode(".")
        );
        status.textContent = "";
    }

    format.addEventListener("change", renderCitation);
    window.showWorkCitation = function(id) {
        if (!GetScoreCreditMetadata(id)) return;
        activeWorkId = id;
        renderCitation();
        dialog.showModal();
    };

    document.getElementById("citation-close").addEventListener("click", () => dialog.close());
    dialog.addEventListener("click", event => {
        const bounds = dialog.getBoundingClientRect();
        if (event.target === dialog && (event.clientX < bounds.left || event.clientX > bounds.right ||
            event.clientY < bounds.top || event.clientY > bounds.bottom)) dialog.close();
    });
    dialog.addEventListener("close", () => document.getElementById("citation-open")?.focus());
    document.getElementById("citation-copy").addEventListener("click", async () => {
        try {
            await navigator.clipboard.writeText(citation.textContent);
            const check = document.createElementNS("http://www.w3.org/2000/svg", "svg");
            check.setAttribute("class", "citation-copy-check");
            check.setAttribute("viewBox", "0 0 24 24");
            check.setAttribute("aria-hidden", "true");
            const stroke = document.createElementNS("http://www.w3.org/2000/svg", "path");
            stroke.setAttribute("d", "M5 12l4 4L19 6");
            check.appendChild(stroke);
            const announcement = document.createElement("span");
            announcement.className = "citation-copy-announcement";
            announcement.textContent = "Citation copied.";
            status.replaceChildren(check, announcement);
        } catch (error) {
            const selection = window.getSelection();
            const range = document.createRange();
            range.selectNodeContents(citation);
            selection.removeAllRanges();
            selection.addRange(range);
            status.textContent = "Could not copy automatically. The citation is selected; use your browser’s Copy command.";
        }
    });
})();
</script>

<style>
.work-score-credit .citation-open {
    display: flex;
    align-items: center;
    gap: 6px;
    margin: 4px 0 0 auto;
    padding: 0;
    border: 0;
    background: transparent;
    color: inherit;
    font: inherit;
    cursor: pointer;
}
.work-score-credit .citation-open:hover { color: #0066cc; text-decoration: underline; }
.citation-open:focus-visible, .citation-dialog :focus-visible { outline: 2px solid #0066cc; outline-offset: 3px; }
.citation-open svg, #citation-copy svg {
    width: 18px;
    height: 18px;
    fill: none;
    stroke: currentColor;
    stroke-width: 1.5;
    stroke-linecap: round;
    stroke-linejoin: round;
    flex-shrink: 0;
}
.citation-open svg {
    width: 19.8px;
    height: 19.8px;
    color: #c86843;
    /* Optically center the scroll artwork with Lusitana's visible letterforms. */
    transform: translateY(-2px);
}
.citation-dialog {
    box-sizing: border-box;
    width: min(630px, calc(100% - 32px));
    max-height: calc(100vh - 48px);
    padding: 20px;
    color: #65584e;
    background: #fff;
    border: 1px solid #c5bbb3;
    border-radius: 6px;
    box-shadow: 0 18px 45px rgba(40, 30, 20, 0.26);
    font-family: "Lusitana", serif;
    font-size: 15px;
    line-height: 1.5;
    text-align: left;
}
.citation-dialog::backdrop { background: rgba(40, 30, 20, 0.48); }
.citation-header { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
.citation-dialog #citation-heading { margin: 0; color: #65584e; font: bold 21px "Lusitana", serif; }
.citation-close { border: 0; background: transparent; color: inherit; padding: 0 4px; font: 28px/1 "Lusitana", serif; cursor: pointer; }
.citation-format-control { margin-top: 16px; }
.citation-dialog .button { border: 1px solid #c5bbb3; border-radius: 4px; background: #faf8f6; color: inherit; padding: 5px 9px; font: inherit; cursor: pointer; }
#citation-format { appearance: auto; max-width: 100%; }
.citation-dialog .citation-text { font: inherit; line-height: 1.6; margin: 16px 0 18px; padding-left: 2em; text-indent: -2em; overflow-wrap: anywhere; user-select: text; }
.citation-dialog .citation-text a { display: inline; color: #0066cc; font: inherit; text-decoration: none; }
.citation-dialog .citation-text a:hover { text-decoration: underline; }
#citation-copy { display: inline-flex; align-items: center; gap: 6px; flex-shrink: 0; }
.citation-actions { display: flex; align-items: center; gap: 10px; }
.citation-dialog .citation-status { display: flex; align-items: center; font: inherit; margin: 0; }
.citation-status:empty { display: none; }
.citation-copy-check { width: 20px; height: 20px; color: #59a26e; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.citation-copy-announcement { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
