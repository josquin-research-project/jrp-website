<script>

let COMMENTARY = {% include metadata/commentary.json %};
let WORKS = {% include metadata/works.json %};
let COMPOSERS = {% include metadata/composers.json %};
let ASSET_AVAILABILITY = {% include metadata/asset-availability.json %};

document.addEventListener("DOMContentLoaded", async () => {
  await checkJosquinLegacyUp(false);
});

//////////////////////////////
//
// document DOMContentLoaded event listener -- This function
//    is called when the document has finished loading.
//

document.addEventListener("DOMContentLoaded", function() {

	SetupAudioPlayback();

	sessionStorage.ERRORsubmitting  = "false";

	var CgiParameters = GetCgiParameters();

	if (typeof CgiParameters['id'] !== "undefined") {
		sessionStorage.WORKjrpid = CgiParameters['id'];
	} else {
		if (typeof sessionStorage.WORKjrpid === 'undefined') {
			sessionStorage.WORKjrpid = "Jos2721";
		}
	}
   JRPID = sessionStorage.WORKjrpid;

	var pieces = sessionStorage.WORKjrpid.match(/^([^\-]+)-.*/);
	if (pieces != null) {
		sessionStorage.WORKjrpid = pieces[1];
	}

	buildComposerSelect();
	buildRepertorySelect();
	buildGenreSelect();

	displayWork(sessionStorage.WORKjrpid);
	setupSearchOnEnter();
	setupWorkToolPanels();

	var analysisbutton1 = document.getElementById("this-work-analysis-button");
	var analysisbutton2 = document.getElementById("all-works-analysis-button");

	analysisbutton1.addEventListener("click", function() {
		displayThisWorkRepertoryAnalyses();
		HideAnalysisRepertory();
	}, false);

	analysisbutton2.addEventListener("click", function() {
		displayAllWorksRepertoryAnalyses();
		ShowAnalysisRepertory();
	}, false);

	if (analysisbutton2.checked) {
		displayAllWorksRepertoryAnalyses();
		ShowAnalysisRepertory();
	} else {
		displayThisWorkRepertoryAnalyses();
		HideAnalysisRepertory();
	}

   setupTooltips();

}, false);



//////////////////////////////
//
// setupWorkToolPanels -- Reveal each tool panel without rebuilding its controls
//     or interrupting the score.
//

function setupWorkToolPanels() {
	var workBody = document.querySelector(".work-body");
	var panels = [];

	function updateToolLayout() {
		var hasOpenTools = panels.some(function(panel) {
			return !panel.hidden;
		});
		if (workBody) {
			workBody.classList.toggle("has-open-tools", hasOpenTools);
		}
	}

	["work-search-toggle", "work-analysis-toggle"].forEach(function(buttonId) {
		var button = document.getElementById(buttonId);
		if (!button) {
			return;
		}
		var panel = document.getElementById(button.getAttribute("aria-controls"));
		if (!panel) {
			return;
		}
		panels.push(panel);
		button.setAttribute("aria-expanded", String(!panel.hidden));
		button.addEventListener("click", function() {
			panel.hidden = !panel.hidden;
			button.setAttribute("aria-expanded", String(!panel.hidden));
			updateToolLayout();
		});
	});
	updateToolLayout();
}



//////////////////////////////
//
// setupTooltips --
//

function setupTooltips() {

	$('#analysis-help').qtip({
		content: {
			text: 'Click for a short description of the analysis tools.'
		}
	});

	$('#search-help').qtip({
		content: {
			text: 'Click for help on expressing search queries.'
		}
	});

}



//////////////////////////////
//
// HideAnalysisRepertory --
//

function HideAnalysisRepertory() {
	var hiddens = document.querySelectorAll(".analysis-hide");
	var i;
	for (i=0; i<hiddens.length; i++) {
		hiddens[i].hidden = true;
	}
}



//////////////////////////////
//
// ShowAnalysisRepertory --
//

function ShowAnalysisRepertory() {
	var hiddens = document.querySelectorAll(".analysis-hide");
	var i;
	for (i=0; i<hiddens.length; i++) {
		hiddens[i].hidden = false;
	}
}



//////////////////////////////
//
// window keydown event listener --
//

window.addEventListener('keydown', function(event) {

	if (event.target.closest && event.target.closest("button")) {
		// Preserve native keyboard activation and focus behavior for buttons.
		return;
	}

	if (event.metaKey) {
		// Don't mess with meta key (command key in OS X)
		return;
	}

	switch (event.keyCode) {

		case CKey:
			if (($(event.target).is('input') && event.ctrlKey) || 
					!$(event.target).is('input')) {
				ClearWorklist();
			}
			break;

		case DKey:
			if (($(event.target).is('input') && event.ctrlKey) || 
					!$(event.target).is('input')) {
				// Ignore this shortcut while typing in an input
				event.preventDefault();
				event.stopPropagation();
				toggleRangeByDuration();
			}
			break;

		case IKey:
			if (($(event.target).is('input') && event.ctrlKey) || 
					!$(event.target).is('input')) {
				// Ignore this shortcut while typing in an input
				event.preventDefault();
				event.stopPropagation();
				toggleIncipitDisplay();
			}
			break;

		case RKey:
			if (($(event.target).is('input') && event.ctrlKey) || 
					!$(event.target).is('input')) {
				// Ignore this shortcut while typing in an input
				event.preventDefault();
				event.stopPropagation();
				toggleRangeDisplay();
			}
			break;

		case RightArrowKey:
			if (event.shiftKey) {
				if (event.ctrlKey) {
					displayNextRepertoryPage();
				} else {
					displayNextWorkPage();
				}
			}
			break;

		case LeftArrowKey:
			if (event.shiftKey) {
				if (event.ctrlKey) {
					displayPreviousRepertoryPage();
				} else {
					displayPreviousWorkPage();
				}
			}
			break;

		case UpArrowKey:
			if (event.shiftKey) {
				if (!SECTIONS || SECTIONS.length < 2) {
					break;
				}

				var i;
				var si = -1;
				for (i=0; i<SECTIONS.length; i++) {
					if (SECTIONS[i].id == sessionStorage.WORKjrpid) {
						si = i;
						break;
					}
				}

				var ocount = SECTIONS.length;
				var current = si;

				// display previous section of multisection work
				if (si < 0) {
					var ocount = $('select#select-section option').length;
					var current = $('select#select-section option:selected').index();
				}
				current--;
				if (current < 0) {
					current = ocount - 1;
				}
				var sectionid = SECTIONS[current].id;
				$('select#select-section').prop('selectedIndex', current);
				if (SECTIONS && (MENUINDEX == 0)) {
					var downloads = document.getElementById("downloads");
					if (downloads) {
						downloads.textContent = "";
					}
				}
				displaySection(sectionid);
				StylizeFormElements();

			}
			break;

		case DownArrowKey:
			if (event.shiftKey) {
				displayNextSection();
			}
			break;

		case OneKey:
			if ($(event.target).is('input') && (!event.ctrlKey)) {
				// Ignore this shortcut while typing in an input
				return;
			}
			event.preventDefault();
			event.stopPropagation();
			displaySectionNumber(1);
			break;

		case TwoKey:
			if ($(event.target).is('input') && (!event.ctrlKey)) {
				// Ignore this shortcut while typing in an input
				return;
			}
			event.preventDefault();
			event.stopPropagation();
			displaySectionNumber(2);
			break;

		case ThreeKey:
			if ($(event.target).is('input') && (!event.ctrlKey)) {
				// Ignore this shortcut while typing in an input
				return;
			}
			event.preventDefault();
			event.stopPropagation();
			displaySectionNumber(3);
			break;

		case FourKey:
			if ($(event.target).is('input') && (!event.ctrlKey)) {
				// Ignore this shortcut while typing in an input
				return;
			}
			event.preventDefault();
			event.stopPropagation();
			displaySectionNumber(4);
			break;

		case FiveKey:
			if ($(event.target).is('input') && (!event.ctrlKey)) {
				// Ignore this shortcut while typing in an input
				return;
			}
			event.preventDefault();
			event.stopPropagation();
			displaySectionNumber(5);
			break;

		case SixKey:
			if ($(event.target).is('input') && (!event.ctrlKey)) {
				// Ignore this shortcut while typing in an input
				return;
			}
			event.preventDefault();
			event.stopPropagation();
			displaySectionNumber(6);
			break;

		case SevenKey:
			if ($(event.target).is('input') && (!event.ctrlKey)) {
				// Ignore this shortcut while typing in an input
				return;
			}
			event.preventDefault();
			event.stopPropagation();
			displaySectionNumber(7);
			break;

		case EightKey:
			if ($(event.target).is('input') && (!event.ctrlKey)) {
				// Ignore this shortcut while typing in an input
				return;
			}
			event.preventDefault();
			event.stopPropagation();
			displaySectionNumber(6);
			break;

		case NineKey:
			if ($(event.target).is('input') && (!event.ctrlKey)) {
				// Ignore this shortcut while typing in an input
				return;
			}
			event.preventDefault();
			event.stopPropagation();
			displaySectionNumber(9);
			break;

		case PKey:
			if ($(event.target).is('input') && (!event.ctrlKey)) {
				// Ignore this shortcut while typing in an input
				return;
			}
			event.preventDefault();
			event.stopPropagation();
			playCurrentWorkAudio();
			break;

		case HomeKey:
			if (event.shiftKey) {
				InitializeWorklist();
				sessionStorage.WORKjrpid = WORKLIST[0].works[0].id;
				displayWork(sessionStorage.WORKjrpid);
				return false;
			}
			break;

		case EndKey:
			if (event.shiftKey) {
				InitializeWorklist();
				sessionStorage.WORKjrpid = WORKLIST[WORKLIST.length-1]
					.works[WORKLIST[WORKLIST.length-1].works.length-1].id;
				displayWork(sessionStorage.WORKjrpid);
				return false;
			}
			break;

	}
});

</script>
