{% include_relative scripts-listeners.html %}

<script>

var HOMEPAGEsampleTitleObserver;

function fitSampleTitle() {
	const slot = document.querySelector(".sample-title-text");
	const link = slot && slot.querySelector("a.sw");
	if (!link || !slot.clientWidth) return;

	// Start at the normal size so shorter titles and wider windows can grow back.
	link.style.fontSize = "";
	let upper = parseFloat(getComputedStyle(link).fontSize);
	if (link.getBoundingClientRect().width <= slot.clientWidth) return;

	let lower = 0;
	while (upper - lower > 0.1) {
		const size = (lower + upper) / 2;
		link.style.fontSize = size + "px";
		if (link.getBoundingClientRect().width > slot.clientWidth) upper = size;
		else lower = size;
	}
	link.style.fontSize = lower + "px";
}


//////////////////////////////
//
// quickBrowse -- Go directly to the full list of works.
//

function quickBrowse() {
	localStorage.BROWSEhome = "false";
	window.location.pathname = "/repertoire";
}



//////////////////////////////
//
// storeBrowseParameters -- Store the quick browse parameters in localStorage 
//     and then go over to the browse page to display result (either to a 
//     browse display or display the home page for browse if no fields 
//     are filled in).
//

function storeBrowseParameters() {

	const composers = document.getElementById("composers")?.value || "";
	const genres    = document.getElementById("genres")?.value || "";
	const voices    = document.getElementById("voices")?.value || "";
	const titlebox  = document.getElementById("titlebox")?.value || "";

	localStorage.BROWSEcomposers = composers;
	localStorage.BROWSEgenres    = genres;
	localStorage.BROWSEvoices    = voices;
	localStorage.BROWSEtitlebox  = titlebox;

	const hasFilters = composers || genres || voices || titlebox;

	if (!hasFilters) {
		window.location.href = "/repertoire?home=true";
	} else {
		window.location.href = "/repertoire";
	}

	return false;
}



//////////////////////////////
//
// displayRandomExample -- Choose a random work from the worklist to
//    show on the frontpage.
//

function displayRandomExample(worklist) {
	// Restrict the sample only; browsing and recent additions use the full list.
	const textedWorks = (worklist || []).filter(
		work => String(work.Texted || "").trim().toLowerCase() === "yes"
	);
	if (!textedWorks.length) return;

	let randomindex = Math.floor(Math.random() * textedWorks.length);
	let randomwork  = textedWorks[randomindex];
	
	// composer display (supports multiple composers)
	let composer = getComposerDisplayFromWork(randomwork);

	// correct work ID
	let jrpid = randomwork.WORK_ID;
	let title    = randomwork.Title;


   // let height   = 0;
   // if (!!randomwork.ih) {
	// 	height = randomwork.ih;
	// } else if (!!randomwork.sections && (randomwork.sections.length > 0)
	// 		&& !!randomwork.sections[0].ih) {
	// 	height = randomwork.sections[0].ih;
	// }

	let output = '<h2 style="width:100%;" class="sample-title">\n';

	output += '<span class="sample-title-text"><a href="';
	output += '/work?id=' + jrpid;
	output += '" class="sw"><span style="color:#9f9187; word-spacing:-2px;';
	output += ' letter-spacing:-0.75px;">Sample Work:</span> ';
	output += '<span class="text-link">';
	output += composer + ', ' + title;
	output += '</span></a></span>\n';

	output += '<span class="sample-title-play">';

	output += `<span id="audio2_${jrpid}" `;
	output += 'style="cursor:hand; cursor:pointer;" ';
	output += "onclick=\"PlayAudioFile('" + jrpid + "', this);\" ";
	output += 'href="" class="play">play</span>';

	output += '</span>\n';

	output += '</h2>\n';
	output += '<a class="sample-incipit-link"><img class="sample-incipit" style="display:block;max-width:100%;height:auto" decoding="async" fetchpriority="high"></a>';

	let sampleMusic = document.querySelector("#sample-music");
	if (!sampleMusic) {
		console.log("ERROR: Cannot find #sample-music");
		return;
	}
	sampleMusic.style.minHeight = "300px";
	sampleMusic.innerHTML = output;
	if (HOMEPAGEsampleTitleObserver) HOMEPAGEsampleTitleObserver.disconnect();
	fitSampleTitle();
	HOMEPAGEsampleTitleObserver = new ResizeObserver(fitSampleTitle);
	HOMEPAGEsampleTitleObserver.observe(sampleMusic.querySelector(".sample-title-text"));
	document.fonts.ready.then(fitSampleTitle);

	const link = sampleMusic.querySelector('.sample-incipit-link');
	link.href = '/work/?id=' + encodeURIComponent(jrpid);
	const image = link.querySelector('img');
	image.alt = 'Opening of ' + title;
	const candidates = ASSET_DELIVERY.candidates(getJosquinDataUrl(jrpid, 'incipit'));
	let candidate = 0;
	image.onload = () => { sampleMusic.style.minHeight = ''; };
	image.onerror = () => {
		if (++candidate < candidates.length) image.src = candidates[candidate];
		else {
			link.textContent = 'View the score';
			sampleMusic.style.minHeight = '';
		}
	};
	image.src = candidates[0];

}



// Display the most recently added or updated works.
function displayRecentAdditions(count, worklist) {
   var recentlyAdded = document.querySelector("#recently-added");
	if (!recentlyAdded) {
		console.error("ERROR: Cannot find #recently-added");
		return;
	}
	var ra = "<h2 class=\"blue-bar\">recently added/updated</h2>\n";
	ra += '<p class="text-brown" style="letter-spacing:0.5px;">';
	ra += 'Click the title of any piece for work-specific search ';
	ra += 'and analysis tools.</p>\n';
	ra += '<div id="recently-added-table"></div>\n';
   recentlyAdded.innerHTML = ra;

	var recent = document.querySelector("#recently-added-table");
	if (!recent) {
		console.error("ERROR: Cannot find #recently-added-table");
		return;
	}

	worklist.sort(function(a, b) {
		date1 = a["Date changed"];
		date2 = b["Date changed"];
		if (!date1) {
			date1 = a["Date added"];
		}
		if (!date2) {
			date2 = b["Date added"];
		}
		if (!date1 && !date2) {
			return 0;
		}
		if (!date1) {
			return +1;
		}
		if (!date2) {
			return -1;
		}
		return date2.localeCompare(date1);
	});

	let tablecontent = printRecentTableHeader();
	for (let i=0; (i<count) && (i<worklist.length); i++) {
		tablecontent += printWorklistRecentEntry(worklist[i]);
	}
	tablecontent += printRecentTableFooter();

	recent.innerHTML = tablecontent;
	sessionStorage.RECENTLYADDEDHTML = tablecontent;
}



//////////////////////////////
//
// printRecentTableHeader -- Print the table header for the recently added
//      works.
//

function printRecentTableHeader() {

	var output = "<table>\n";
	output += "<thead>\n";
	output += "<tr>\n";
	output += "<th style=\"padding-right:40px;\">Composer</th>\n";
	output += "<th>Title</th>\n";
	output += "<th>&nbsp;&nbsp;&nbsp;&nbsp;Scores</th>\n";
	output += "<th style=\"padding-left:30px;\">MP3</th>\n";
	output += "</tr>\n";
	output += "</thead>\n";
	output += "</tbody>\n";
	return output;
}



//////////////////////////////
//
// printRecentTableFooter -- Print the table footer for the recently added
//       works.
//

function printRecentTableFooter() {
	var output = "</tbody>\n";
	output += "</table>\n";
	return output;
}



///////////////////////////////
//
// printWorklistRecentEntry -- Create the recently added work list.
//

function printWorklistRecentEntry(entry) {
	if (!entry) {
		console.error("NO CONTENTS: ", entry);
		return "";
	}

	var title = entry.Title || "";
	var matches = title.match(/\((.*?)\)/g);
	if (matches && matches.length > 1) {
		title = title.replace(matches[1], "");
	}
	var subtitle = entry.Subtitle;
	if (subtitle) {
		title += ` <i>${subtitle}</i>`;
	}

	var jrpid    = entry.WORK_ID;

	// Updated: pull composer(s) from COMPOSER_ID
	var composer = getComposerDisplayFromWork(entry);

	// fallback if something is missing
	if (!composer) {
		composer = entry["COM-short"] || entry.Composer || "";
	}

	var voices;
	if (typeof entry.Voices === "undefined")  {
		voices = "?";
	} else {
		voices = entry.Voices;
	}

	var output = "<tr>\n";

	// Composer:
	output += "<td>";
	output += composer;
	output += "</td>\n";

	// Title:
	output += "<td><a href=\"";
	output += "/work?id=" + jrpid;
	output += "\" class=\"text-link\">";
	output += title;
	output += "</a></td>\n";

	// Voices:
	// output += "<td>" + voices + "</td>\n";

	// Scores
	output += "<td>\n";
	output += "<a target=\"" + PDFTARGET + "\" href=\"";
	output += getBestPdfUrl(jrpid, "no_edit");
	output += "\" class=\"file\">file</a>\n";
	output += "<a target=\"" + PDFTARGET + "\" href=\"";
	output += getBestPdfUrl(jrpid, "edit");
	output += "\" class=\"file-ed\">Ed.</a>\n";
	output += "</td>\n";

	// MP3 playback button
	output += "<td style=\"padding-left:30px;\">";
	output += "<span id=\"audio_" + jrpid + "\"";
	output += "style=\"cursor:hand; cursor:pointer;\" ";
	output += "onclick=\"PlayAudioFile('" + jrpid + "', this);\" ";
	output += "href=\"\" class=\"play\">play</span>";
	output += "</td>\n";

	output += "</tr>\n";

	return output;
}



//////////////////////////////
//
// buildComposerSelect -- Create the Composer drop-down list for browsing.
//

function buildHomepageComposerSelect(worklist) {
	const select = document.getElementById("composers");
	if (!select) return;

	let output = '<option value="">All Composers</option>\n';
	output += GetComposerOptions(worklist); // OK to sort here if desired

	select.innerHTML = output;
	StylizeFormElements();
}



//////////////////////////////
//
// buildGenreSelect -- Create the Genre drop-down list for browsing.
//


function buildHomepageGenreSelect() {
	const select = document.getElementById("genres");
	if (!select) return;

	let output = '<option value="">All Genres</option>\n';
	output += GetGenreBrowseOptions();

	select.innerHTML = output;
	StylizeFormElements();
}



//////////////////////////////
//
// buildHomepageVoiceSelect -- Create the voice drop-down list for browsing.
//

function buildHomepageVoiceSelect() {
	const select = document.getElementById("voices");
	if (!select) return;

	let output = '<option value="">All Voices</option>\n';
	output += GetVoiceOptions();

	select.innerHTML = output;
	StylizeFormElements();
}


</script>
