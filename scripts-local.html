<script>

var HOMEPAGEscoreFetchTimeoutMs = 5000;


//////////////////////////////
//
// quickBrowse -- Go directly to the full list of works.
//

function quickBrowse() {
	localStorage.BROWSEhome = "false";
	window.location.pathname = "/repertoire";
}



//////////////////////////////
//
// storeBrowseParameters -- Store the quick browse parameters in localStorage 
//     and then go over to the browse page to display result (either to a 
//     browse display or display the home page for browse if no fields 
//     are filled in).
//

function storeBrowseParameters() {

	const composers = document.getElementById("composers")?.value || "";
	const genres    = document.getElementById("genres")?.value || "";
	const voices    = document.getElementById("voices")?.value || "";
	const titlebox  = document.getElementById("titlebox")?.value || "";

	localStorage.BROWSEcomposers = composers;
	localStorage.BROWSEgenres    = genres;
	localStorage.BROWSEvoices    = voices;
	localStorage.BROWSEtitlebox  = titlebox;

	const hasFilters = composers || genres || voices || titlebox;

	if (!hasFilters) {
		window.location.href = "/repertoire?home=true";
	} else {
		window.location.href = "/repertoire";
	}

	return false;
}



//////////////////////////////
//
// displayRandomExample -- Choose a random work from the worklist to
//    show on the frontpage.
//

function displayRandomExample(worklist) {
	// InitializeWorklistFlat();

	if (!worklist || !worklist.length) return;

	let randomindex = Math.floor(Math.random() * worklist.length);
	let randomwork  = worklist[randomindex];
	
	// composer display (supports multiple composers)
	let composer = getComposerDisplayFromWork(randomwork);

	// correct work ID
	let jrpid = randomwork.WORK_ID;
	let title    = randomwork.Title;

	let filename = randomwork.Filename;

   // let height   = 0;
   // if (!!randomwork.ih) {
	// 	height = randomwork.ih;
	// } else if (!!randomwork.sections && (randomwork.sections.length > 0)
	// 		&& !!randomwork.sections[0].ih) {
	// 	height = randomwork.sections[0].ih;
	// }

	let output = '<h2 style="width:100%;" class="sample-title">\n';

	output += '<table width=100%><tr><td>';
	output += '<span style="float:left;"><a href="';
	output += '/work?id=' + jrpid;
	output += '" class="sw"><span style="color:#9f9187; word-spacing:-2px;';
	output += ' letter-spacing:-0.75px;">Sample Work:</span> ';
	output += '<span class="text-link">';
	output += composer + ', ' + title;
	output += '</span></a></span>\n';

	output += '</td><td>';

	output += '<span style="float:right; margin-right:10px;">';

	output += `<span id="audio2_${jrpid}" `;
	output += 'style="cursor:hand; cursor:pointer;" ';
	output += "onclick=\"PlayAudioFile('" + jrpid + "', this);\" ";
	output += 'href="" class="play">play</span>';

	output += '</span>\n';

	output += '</td></tr></table>';

	output += '</h2>\n';
	output += '<scr';
	output += 'ipt id="random-music" type="text/x-humdrum"></scr'
	output += 'ipt>';

	let sampleMusic = document.querySelector("#sample-music");
	if (!sampleMusic) {
		console.log("ERROR: Cannot find #sample-music");
		return;
	}
	sampleMusic.style.minHeight = "300px";
	sampleMusic.innerHTML = output;

	loadHomepageHumdrumScore(jrpid, filename).then(function(score) {

			console.warn("Homepage random Humdrum score unavailable", jrpid);
			return;
		}

		if (!script) {

		}

		script.textContent = score.text;
		displayHumdrum({
			incipit: "true",
			source: "random-music",

			// spacingLinear: 0.18,
			// spacingNonLinear: 0.45,

		console.error("Unable to render homepage random Humdrum score", error);
	});

}



//////////////////////////////
//
// loadHomepageHumdrumScore -- Try data.josqu.in first, then GitHub raw fallback.
//

async function loadHomepageHumdrumScore(jrpid, filename) {
	return await loadHomepageHumdrumScoreFromCandidates(getHomepageHumdrumScoreCandidates(jrpid, filename));
}



function getHomepageHumdrumScoreCandidates(jrpid, filename) {
	let candidates = [];

	addHomepageHumdrumCandidate(candidates, {
		source: "data",
		url: getJosquinDataUrl(jrpid, "humdrum")
	});

	addHomepageHumdrumCandidate(candidates, {
		source: "data-mirror",
		url: getJosquinDataFallbackUrl(jrpid, "humdrum")
	});

	addHomepageHumdrumCandidate(candidates, {
		source: "github",
		url: getHomepageGithubHumdrumUrl(filename)
	});

	return candidates;
}



function addHomepageHumdrumCandidate(candidates, candidate) {
	if (!candidate.url) {
		return;
	}
	for (let i=0; i<candidates.length; i++) {
		if (candidates[i].url === candidate.url) {
			return;
		}
	}
	candidates.push(candidate);
}



async function loadHomepageHumdrumScoreFromCandidates(candidates) {
	if (!Array.isArray(candidates)) {
		return null;
	}

	for (let i=0; i<candidates.length; i++) {
		try {
			let response = await fetchHomepageHumdrumCandidate(candidates[i]);
			if (!response.ok) {
				continue;
			}
			let text = await response.text();
			if (isHomepageHumdrumScoreText(text)) {
				return {
					source: candidates[i].source,
					url: candidates[i].url,
					text: text
				};
			}
		} catch (error) {
			console.warn("Could not load homepage Humdrum candidate", candidates[i].url, error);
		}
	}

	return null;
}



async function fetchHomepageHumdrumCandidate(candidate) {
	let options = { cache: "no-cache" };
	let controller = null;
	let timeout = null;
	let fallbackTimeout = null;

	if (typeof AbortController === "function") {
		controller = new AbortController();
		options.signal = controller.signal;
		timeout = window.setTimeout(function() {
			controller.abort();
		}, HOMEPAGEscoreFetchTimeoutMs);
	}

	try {
		let request = fetch(candidate.url, options);
		if (!controller) {
			request = Promise.race([
				request,
				new Promise(function(resolve, reject) {
					fallbackTimeout = window.setTimeout(function() {
						reject(new Error("Timed out loading homepage Humdrum score"));
					}, HOMEPAGEscoreFetchTimeoutMs);
				})
			]);
		}
		return await request;
	} finally {
		if (timeout) {
			window.clearTimeout(timeout);
		}
		if (fallbackTimeout) {
			window.clearTimeout(fallbackTimeout);
		}
	}
}



function getHomepageGithubHumdrumUrl(filename) {
	let path = getHomepageGithubHumdrumPath(filename);
	if (!path) {
		return "";
	}

	return "https://raw.githubusercontent.com/josquin-research-project/jrp-scores/main/" + path;
}



function getHomepageGithubHumdrumPath(filename) {
	if (!filename) {
		return "";
	}

	let path = filename.replace(/^\/+/, "");
	let matches = path.match(/^([A-Z][a-z][a-z])/);
	if (!matches) {
		return "";
	}

	let composer = matches[1];
	path = path.replace(new RegExp("^" + composer + "/kern/"), composer + "/");
	if (path.indexOf(composer + "/") !== 0) {
		path = composer + "/" + path;
	}

	return path.split("/").map(encodeURIComponent).join("/");
}



function isHomepageHumdrumScoreText(text) {
	return !!(text && text.match(/\*\*kern/));
}



//////////////////////////////
//
// resetHeight --
//

function resetHeight(id) {
	var sampleMusic = document.getElementById("sample-music");
	sampleMusic.style.height = "";
}


//////////////////////////////
//
// displayRecentAdditions -- 
//

function displayRecentAdditions(count, worklist) {
   var recentlyAdded = document.querySelector("#recently-added");
	if (!recentlyAdded) {
		console.error("ERROR: Cannot find #recently-added");
		return;
	}
	var ra = "<h2 class=\"blue-bar\">recently added/updated</h2>\n";
	ra += '<p class="text-brown" style="letter-spacing:0.5px;">';
	ra += 'Click the title of any piece for work-specific search ';
	ra += 'and analysis tools.</p>\n';
	ra += '<div id="recently-added-table"></div>\n';
   recentlyAdded.innerHTML = ra;

	var recent = document.querySelector("#recently-added-table");
	if (!recent) {
		console.error("ERROR: Cannot find #recently-added-table");
		return;
	}

	worklist.sort(function(a, b) {
		date1 = a["Date changed"];
		date2 = b["Date changed"];
		if (!date1) {
			date1 = a["Date added"];
		}
		if (!date2) {
			date2 = b["Date added"];
		}
		if (!date1 && !date2) {
			return 0;
		}
		if (!date1) {
			return +1;
		}
		if (!date2) {
			return -1;
		}
		return date2.localeCompare(date1);
	});

	let tablecontent = printRecentTableHeader();
	for (let i=0; (i<count) && (i<worklist.length); i++) {
		tablecontent += printWorklistRecentEntry(worklist[i]);
	}
	tablecontent += printRecentTableFooter();

	recent.innerHTML = tablecontent;
	sessionStorage.RECENTLYADDEDHTML = tablecontent;
}



//////////////////////////////
//
// printRecentTableHeader -- Print the table header for the recently added
//      works.
//

function printRecentTableHeader() {

	var output = "<table>\n";
	output += "<thead>\n";
	output += "<tr>\n";
	output += "<th style=\"padding-right:40px;\">Composer</th>\n";
	output += "<th>Title</th>\n";
	output += "<th>&nbsp;&nbsp;&nbsp;&nbsp;Scores</th>\n";
	output += "<th style=\"padding-left:30px;\">MP3</th>\n";
	output += "</tr>\n";
	output += "</thead>\n";
	output += "</tbody>\n";
	return output;
}



//////////////////////////////
//
// printRecentTableFooter -- Print the table footer for the recently added
//       works.
//

function printRecentTableFooter() {
	var output = "</tbody>\n";
	output += "</table>\n";
	return output;
}



///////////////////////////////
//
// printWorklistRecentEntry -- Create the recently added work list.
//

function printWorklistRecentEntry(entry) {
	if (!entry) {
		console.error("NO CONTENTS: ", entry);
		return "";
	}

	var title = entry.Title || "";
	var matches = title.match(/\((.*?)\)/g);
	if (matches && matches.length > 1) {
		title = title.replace(matches[1], "");
	}
	var subtitle = entry.Subtitle;
	if (subtitle) {
		title += ` <i>${subtitle}</i>`;
	}

	var jrpid    = entry.WORK_ID;

	// Updated: pull composer(s) from COMPOSER_ID
	var composer = getComposerDisplayFromWork(entry);

	// fallback if something is missing
	if (!composer) {
		composer = entry["COM-short"] || entry.Composer || "";
	}

	var voices;
	if (typeof entry.Voices === "undefined")  {
		voices = "?";
	} else {
		voices = entry.Voices;
	}

	var output = "<tr>\n";

	// Composer:
	output += "<td>";
	output += composer;
	output += "</td>\n";

	// Title:
	output += "<td><a href=\"";
	output += "/work?id=" + jrpid;
	output += "\" class=\"text-link\">";
	output += title;
	output += "</a></td>\n";

	// Voices:
	// output += "<td>" + voices + "</td>\n";

	// Scores
	output += "<td>\n";
	output += "<a target=\"" + PDFTARGET + "\" href=\"";
	output += getBestPdfUrl(jrpid, "no_edit");
	output += "\" class=\"file\">file</a>\n";
	output += "<a target=\"" + PDFTARGET + "\" href=\"";
	output += getBestPdfUrl(jrpid, "edit");
	output += "\" class=\"file-ed\">Ed.</a>\n";
	output += "</td>\n";

	// MP3 playback button
	output += "<td style=\"padding-left:30px;\">";
	output += "<span id=\"audio_" + jrpid + "\"";
	output += "style=\"cursor:hand; cursor:pointer;\" ";
	output += "onclick=\"PlayAudioFile('" + jrpid + "', this);\" ";
	output += "href=\"\" class=\"play\">play</span>";
	output += "</td>\n";

	output += "</tr>\n";

	return output;
}

</script>
